    function compressBannerImage(file, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 1000;
          const scale = img.width > maxW ? (maxW / img.width) : 1;
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', 0.80));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function readPdfAsDataUrl(file, callback) {
      if (file.size > 2.5 * 1024 * 1024) {
        showToast('PDF > 2.5MB: Please use Google Drive link for large PDFs!');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => callback(e.target.result);
      reader.readAsDataURL(file);
    }

          if (!parsed.levels) parsed.levels = [...DEFAULT_LEVELS];
          if (!Array.isArray(parsed.festivals)) parsed.festivals = [];
          if (!Array.isArray(parsed.holidays)) parsed.holidays = [];
          if (!Array.isArray(parsed.syllabusSemesters)) parsed.syllabusSemesters = JSON.parse(JSON.stringify(DEFAULT_DB.syllabusSemesters));
          if (!Array.isArray(parsed.subjects)) parsed.subjects = [...ARTS_SUBJECTS];
          if (!parsed.pageBanners) parsed.pageBanners = JSON.parse(JSON.stringify(DEFAULT_DB.pageBanners));
          return parsed;
        }
      } catch (e) {}
      const d = JSON.parse(JSON.stringify(DEFAULT_DB));
      d.levels = [...DEFAULT_LEVELS];
      return d;
    }

          try {
            const parsed = JSON.parse(reader.result);
            db = parsed;
            saveAndSync('Imported backup & synced!');
          } catch (err) {
            showToast('Invalid JSON file!');
          }
        };
        reader.readAsText(file);
      });

      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
